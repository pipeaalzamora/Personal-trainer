name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      TRANSBANK_ENVIRONMENT: integration
      TRANSBANK_COMMERCE_CODE: ci-commerce-code
      TRANSBANK_API_KEY: ci-api-key
      RESEND_API_KEY: ci-resend-key
      ADMIN_API_KEY: ci-admin-key
      TRANSACTION_SECRET_KEY: ci-transaction-secret-key
      USER_SESSION_SECRET: ci-user-session-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
